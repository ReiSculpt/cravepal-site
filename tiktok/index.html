<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Linking TikTok, CravePal</title>
<link rel="icon" href="../assets/icon-32.png" sizes="32x32" type="image/png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#DCEFE2;color:#1E1420;font:16px/1.5 system-ui,-apple-system,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  img{width:140px;height:auto}
  h1{font-size:22px;margin:12px 0 4px}
  p{margin:0;max-width:34ch}
</style>
</head>
<body>
<main>
  <img src="../assets/pal/pal-grumpy.webp" alt="">
  <h1 id="t">Linking TikTok…</h1>
  <p id="m">Hang on, handing you back to CravePal.</p>
</main>
<script>
// TikTok sends the sign-in back here (it only accepts an https address we own).
// The CravePal drafts helper runs on the founders' own computer, so pass the
// result straight on to it. Nothing is stored or sent anywhere else.
(function () {
  var q = location.search;
  if (!/[?&](code|error)=/.test(q)) {
    document.getElementById('t').textContent = 'Nothing to link here';
    document.getElementById('m').textContent = 'This page is only used while connecting a TikTok account.';
    return;
  }
  setTimeout(function () {
    document.getElementById('t').textContent = 'Not linked yet';
    document.getElementById('m').textContent = 'Open this link on the computer that runs CravePal drafts, with the helper running.';
  }, 4000);
  location.replace('http://localhost:5390/tiktok/callback' + q);
})();
</script>
</body>
</html>
